<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>名古屋・飛驒高山・白川鄉・新穗高 7天6夜冬日手帳</title>

  <link rel="apple-touch-icon" href="https://image.api.weibo.com/20241028/n-71959b862b6622b34a142b781b238384.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="名古屋冬日手帳">

  <!-- Google Font: 粉圓 (Huninn) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #FFFCF6;
      --border-color: #3E3A39;
      --coral: #F2A497;
      --yellow: #F6D27A;
      --water: #A8D3E6;
      --green: #B9DAA5;
      --gray-bg: #F5EFEE;
      --shadow: 4px 4px 0px #3E3A39;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Huninn', sans-serif, system-ui;
      color: var(--border-color);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      padding-top: 70px;
      padding-bottom: 40px;
      line-height: 1.6;
    }

    /* 通用日系繪本卡片與粗線框 */
    .storybook-card {
      background: #FFFFFF;
      border: 3px solid var(--border-color);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 頂端固定選單 */
    nav.navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--bg-color);
      border-bottom: 3px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      padding: 0 2px;
    }

    nav.navbar a {
      text-decoration: none;
      font-weight: bold;
      font-size: 0.75rem;
      padding: 5px 4px;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    nav.navbar a:active, nav.navbar a.active {
      background: var(--yellow);
      border-color: var(--border-color);
    }

    /* Hero 區域與浮動 SVG 動畫 */
    .hero {
      text-align: center;
      background: #FFF9EE;
      position: relative;
      overflow: hidden;
    }

    .hero-title {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 14px;
    }

    /* 包含秒數的倒數計時 */
    .countdown-box {
      display: inline-flex;
      gap: 8px;
      background: var(--water);
      border: 3px solid var(--border-color);
      border-radius: 16px;
      padding: 8px 14px;
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .countdown-item {
      text-align: center;
      min-width: 36px;
    }

    .countdown-item .num {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .countdown-item .label {
      font-size: 0.7rem;
    }

    /* SVG 可愛輕微晃動動畫 */
    .floating-svg {
      animation: floatAnim 3s ease-in-out infinite alternate;
    }
    @keyframes floatAnim {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(2deg); }
    }

    /* 航班卡片 */
    .flight-card {
      background: #FAFAFA;
    }

    .flight-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .flight-badge {
      background: var(--coral);
      padding: 3px 8px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      font-size: 0.8rem;
      font-weight: bold;
    }

    .flight-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .flight-node .code {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .flight-node .time {
      font-size: 0.85rem;
      color: #555;
    }

    /* 乾淨連結按鈕 */
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #FFF;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 2px 2px 0px var(--border-color);
      margin-top: 6px;
      margin-right: 4px;
      transition: transform 0.1s ease;
      cursor: pointer;
    }
    .link-btn:active {
      transform: translateY(2px);
      box-shadow: 0px 0px 0px var(--border-color);
    }

    /* 日期切換 Tab */
    .day-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .day-selector::-webkit-scrollbar {
      display: none;
    }

    .day-btn {
      flex: 0 0 auto;
      background: #FFF;
      border: 3px solid var(--border-color);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-color);
      transition: transform 0.15s ease;
    }

    .day-btn.active {
      background: var(--coral);
      transform: translateY(2px);
      box-shadow: 0px 0px 0px var(--border-color);
    }

    /* 行程彈跳切換動畫 */
    .timeline-container {
      display: none;
    }

    .timeline-container.active {
      display: block;
      animation: bounceIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.95) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* 時間軸 */
    .timeline {
      position: relative;
      padding-left: 20px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 10px;
      bottom: 10px;
      width: 4px;
      background: var(--border-color);
      border-radius: 2px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 20px;
      padding-left: 16px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--yellow);
      border: 3px solid var(--border-color);
    }

    .timeline-time {
      font-size: 0.85rem;
      font-weight: bold;
      color: #666;
    }

    .timeline-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin: 2px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-must {
      background: var(--coral);
      border: 2px solid var(--border-color);
      font-size: 0.75rem;
      padding: 1px 8px;
      border-radius: 8px;
      font-weight: bold;
    }

    .tag-trans {
      background: var(--water);
      border: 2px solid var(--border-color);
      font-size: 0.75rem;
      padding: 1px 8px;
      border-radius: 8px;
    }

    .tag-book {
      background: var(--yellow);
      border: 2px solid var(--border-color);
      font-size: 0.75rem;
      padding: 1px 8px;
      border-radius: 8px;
      font-weight: bold;
    }

    .timeline-desc {
      font-size: 0.88rem;
      color: #444;
      margin-top: 4px;
    }

    .tips-box {
      background: #FFF9EE;
      border: 2px dashed var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #555;
    }

    /* 獨立餐廳卡片樣式 */
    .restaurant-card-item {
      background: #FFF9EE;
      border: 2.5px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .restaurant-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .restaurant-name {
      font-weight: bold;
      font-size: 1.02rem;
    }

    .restaurant-day-badge {
      background: var(--coral);
      border: 2px solid var(--border-color);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 1px 8px;
      border-radius: 8px;
    }

    .restaurant-meta {
      font-size: 0.85rem;
      color: #555;
      line-height: 1.5;
    }

    /* --- 🛍️ 購物清單樣式 --- */
    .shopping-brand-card {
      background: #FFF;
      border: 3px solid var(--border-color);
      border-radius: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
      background: #FFF;
      user-select: none;
    }

    .brand-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 2.5px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.95rem;
      background: var(--water);
    }

    .brand-name {
      font-weight: bold;
      font-size: 1.05rem;
    }

    .brand-count-badge {
      background: var(--gray-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 2px 10px;
      font-weight: bold;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-body {
      display: none;
      padding: 12px 16px;
      border-top: 2.5px dashed var(--border-color);
      background: #FAFAFA;
    }

    .brand-body.open {
      display: block;
    }

      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 1
